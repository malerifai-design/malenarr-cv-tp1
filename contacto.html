                                            fill="#FFFFFF" />
                                    </svg>

                            </label>

                            <label>
                                soy tibio/a

                                <span class="check-personalizado">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="23" height="22" viewBox="0 0 23 22"
                                        fill="none">
                                        <path
                                            d="M11.4126 0L14.1068 8.2918H22.8253L15.7719 13.4164L18.466 21.7082L11.4126 16.5836L4.35917 21.7082L7.05334 13.4164L0 8.2918H8.71843L11.4126 0Z"

    <a href="#top" id="volver-top">
        <svg viewBox="0 0 350.81 350.81">
            <circle id="circulito" cx="175.4" cy="175.4" r="175.4" />
            <path id="flechita"
                d="M189.74,56.27l69.85,69.84c7.85,7.85,7.85,20.59,0,28.44-7.85,7.85-20.59,7.85-28.43,0l-36.88-36.88v163.63c0,10.53-8.61,19.14-19.14,19.14h0c-10.53,0-19.14-8.61-19.14-19.14V118.46s-36.35,36.34-36.35,36.34c-7.85,7.85-20.58,7.85-28.43,0-3.92-3.92-5.89-9.07-5.89-14.22,0-5.14,1.97-10.29,5.89-14.22l70.1-70.1c7.85-7.85,20.58-7.85,28.43,0h0Z" />
        </svg>

    <script>

        const boton = document.getElementById("volver-top");

        function mostrarBotonTop() {
            const scrollMaximo =
                document.documentElement.scrollHeight - window.innerHeight;

            if (scrollMaximo > 0 && window.scrollY >= scrollMaximo * 0.5) {
                boton.classList.add("visible");
            } else {
                boton.classList.remove("visible");
            }
        }

        window.addEventListener("scroll", mostrarBotonTop);
        window.addEventListener("resize", mostrarBotonTop);

        mostrarBotonTop();

    </script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const paginaActual = window.location.pathname.split("/").pop();
            const botones = document.querySelectorAll(".menu .boton");

            botones.forEach(function (boton) {
                const destino = boton.getAttribute("href");

                if (destino === paginaActual) {
                    boton.classList.add("activo");
                }
            });
        });
    </script>
